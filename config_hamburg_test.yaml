# Auto-generated config: hamburg_test
project:
  city_name: "hamburg_test"
  crs: "EPSG:25832"
  paths:
    input_gdb: null
    buildings: "./input_data_hamburg_test_prepared/Buildings.gpkg"
    statistical_units: "./input_data_hamburg_test_prepared/StatisticalUnits.gpkg"
    streets: "./input_data_hamburg_test_prepared/Streets.gpkg"
    flood_dir: "./input_data_hamburg_test_prepared/Floodlevels"
    output_dir: "./outputs/hamburg_test"

# Paper-replication (Section 4.5): TOPSIS on stat-unit demographic percentages
#set to Default 'building' preserves the per-building behaviour
topsis_granularity: stat_unit

schema:
  buildings_layer: null
  stats_layer: null
  streets_layer: null
  stat_unit_col: "StatisticalUnit"
  residents_col: "Residents"
  living_area_col: "LivingArea"
  floors_col: "Floors"
  building_type_col: "Building_type"
  sensitivity_fields: ["ES", "C"]      # elderly singles (w=0.7) + children (w=0.3)
  coping_fields: ["WR", "EDQ"]         # welfare (0.5) + education (0.5)
hazard_settings:
  hma_buffers: [5, 15, 30]
  hwb_buffer: 2
  flood_depths: [30, 40, 50, 60, 70, 80, 90, 100]
  flood_threshold: 0.3
  shape_param: 0.25
  min_area_threshold: 0.0
  hwb_clip_max: null      # null = paper Eq.2 (unclipped, max ~9), set to 1.0 to match paper public figs
risk_settings:
  weight_hazard: 1.0
  weight_exposure: 1.0
  weight_vulnerability: 1.0
  smoothing_iterations: 3
  max_neighbors: 10
  distance_threshold: 100
  n_classes: 5
  normalize_exposure: false
topsis_weights:
  sensitivity: [0.7, 0.3]
  coping_capacity: [0.5, 0.5]
  svi: [0.5, 0.5]
svpf_threshold: 0.25
svpf_transform: 2.0
visualization:
  figsize: [24, 8]
  dpi: 150
  classification_mode: "head_tail"
  n_iterations: 3
