# Hamburg pluvial flood risk configuration
# All settings in one file. For a new city, copy this and change paths + CRS.

project:
  city_name: "Hamburg"
  crs: "EPSG:25832"

  paths:
    input_gdb: "data/inputs/pluvialfloodriskmap.gdb"
    flood_dir: "data/inputs/Floodlevels_extracted/Floodlevels"
    output_dir: "data/outputs"
    boundary_file: "data/inputs/hamburg_boundary.gpkg"

schema:
  buildings_layer: "Building_ExampleLayer"
  stats_layer: "StatisticalExampleUnit"
  streets_layer: "Streets"
  stat_unit_col: "StatisticalUnit"
  residents_col: "Residents"
  living_area_col: "LivingArea"
  floors_col: "Floors"
  building_type_col: "Building_type"
  sensitivity_fields: ["ES", "C"]       # ArcGIS: Elderly Singles + Children
  coping_fields: ["WR", "EDQ"]          # ArcGIS: Welfare Recipients + Education

hazard_settings:
  hma_buffers: [5, 15, 30]
  hwb_buffer: 2
  flood_depths: [30, 40, 50, 60, 70, 80, 90, 100]
  flood_threshold: 0.3                  # 30cm depth for HMA
  shape_param: 0.25                     # lognormal CDF shape
  min_area_threshold: 0.0

risk_settings:
  weight_hazard: 1.0
  weight_exposure: 1.0
  weight_vulnerability: 1.0
  smoothing_iterations: 3
  max_neighbors: 10
  distance_threshold: 100
  n_classes: 5

topsis_weights:
  sensitivity: [0.7, 0.3]        # ArcGIS: ES(0.7), C(0.3)
  coping_capacity: [0.5, 0.5]    # ArcGIS: WR(0.5), EDQ(0.5)
  svi: [0.5, 0.5]                # ArcGIS: [CopingCapacity, Sensitivity]

topsis_entropy:
  sensitivity: true               # ArcGIS: entropy=true for all three steps
  coping_capacity: true
  svi: true

svpf_threshold: 0.25
svpf_transform: 2.0

visualization:
  figsize: [24, 8]
  dpi: 300
  colors:
    pfrma: ["#F5F5F5", "#FFF2CC", "#FFE599", "#FFD966", "#FF9900", "#CC7A00"]
    pfrwb: ["#F5F5F5", "#E6E6FA", "#DDA0DD", "#BA55D3", "#8B44AD", "#663399"]